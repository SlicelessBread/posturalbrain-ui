<!-- @dsCard group="Azioni" height=180 subtitle="Scelta multipla, con e senza icona" -->
<div class="pb-stack">
  <div class="pb-row" role="group" aria-label="Piattaforme">
    <button class="pb-chip" type="button" aria-pressed="true">{{icon:check:sm}}YouTube</button>
    <button class="pb-chip" type="button" aria-pressed="true">{{icon:check:sm}}Instagram</button>
    <button class="pb-chip" type="button" aria-pressed="false">Facebook</button>
    <button class="pb-chip" type="button" aria-pressed="false">TikTok</button>
  </div>
  <div class="pb-row" role="group" aria-label="Filtra i video">
    <button class="pb-chip" type="button" aria-pressed="true">Tutti</button>
    <button class="pb-chip" type="button" aria-pressed="false">{{icon:heart:sm}}Preferiti</button>
    <button class="pb-chip" type="button" aria-pressed="false">Schiena</button>
  </div>
</div>
