<!-- @dsCard group="Video e file" height=720 subtitle="Pronto, in caricamento, verticale, non disponibile" -->
<div class="pb-stack">
  <figure class="pb-player">
    <div class="pb-player__frame"><button class="pb-player__play" type="button" aria-label="Riproduci">{{icon:play:lg}}</button><span class="pb-player__duration pb-num">4:32</span></div>
    <figcaption class="pb-player__caption"><span class="text-section">Mobilità dell'anca al risveglio</span><span class="text-label pb-muted">Anche · assegnato il 12 novembre</span></figcaption>
  </figure>
  <div class="pb-grid-2">
    <figure class="pb-player"><div class="pb-player__frame"><span class="pb-spinner pb-spinner--lg pb-player__spinner" role="status"><span class="pb-sr-only">Caricamento del video</span></span></div></figure>
    <figure class="pb-player"><div class="pb-player__frame pb-player__frame--error"><span class="pb-player__message">{{icon:circle-alert}}<span class="text-label">Il video non è più disponibile.</span></span></div></figure>
  </div>
  <figure class="pb-player pb-player--portrait">
    <div class="pb-player__frame"><button class="pb-player__play" type="button" aria-label="Riproduci">{{icon:play:lg}}</button><span class="pb-player__duration pb-num">0:58</span></div>
  </figure>
</div>
