<!-- @dsCard group="Moduli" height=240 subtitle="Data di inizio; data con errore" -->
<div class="pb-stack">
  <label class="pb-field"><span class="pb-field__label text-label">Inizio del percorso</span>
    <span class="pb-input-group"><input class="pb-input" type="date" value="2026-11-14"><span class="pb-input-group__suffix" aria-hidden="true">{{icon:calendar-days}}</span></span>
    <span class="pb-field__help text-caption">Finisce il 14 maggio 2027.</span>
  </label>
  <label class="pb-field pb-field--invalid"><span class="pb-field__label text-label">Scadenza della seconda rata</span>
    <span class="pb-input-group"><input class="pb-input" type="date" value="2026-10-01" aria-invalid="true"><span class="pb-input-group__suffix" aria-hidden="true">{{icon:calendar-days}}</span></span>
    <span class="pb-field__error text-caption">{{icon:circle-alert:sm}}La rata scade prima dell'inizio del percorso.</span>
  </label>
</div>
