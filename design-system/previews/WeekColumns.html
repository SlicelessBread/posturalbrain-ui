<!-- @dsCard group="Calendario" height=420 subtitle="Sette colonne, oggi in evidenza, giorno scelto con il dettaglio sotto" -->
<div class="pb-stack">
  <div class="pb-week"><div class="pb-week__grid">
    <button class="pb-week__day pb-week__day--today" type="button" aria-pressed="true" aria-label="Lunedì 30 novembre, oggi, 4 eventi"><span class="pb-week__dow">Lun</span><span class="pb-week__num">30</span><span class="pb-event pb-event--compact pb-event--due">{{icon:euro:sm}}AC</span><span class="pb-event pb-event--compact pb-event--start">{{icon:play:sm}}MD</span><span class="pb-event pb-event--compact pb-event--paid">{{icon:check:sm}}LB</span><span class="pb-event pb-event--compact pb-event--end">{{icon:flag:sm}}PR</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Martedì 1 dicembre, nessun evento"><span class="pb-week__dow">Mar</span><span class="pb-week__num">1</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Mercoledì 2 dicembre, 1 evento"><span class="pb-week__dow">Mer</span><span class="pb-week__num">2</span><span class="pb-event pb-event--compact pb-event--due">{{icon:euro:sm}}SC</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Giovedì 3 dicembre, 2 eventi"><span class="pb-week__dow">Gio</span><span class="pb-week__num">3</span><span class="pb-event pb-event--compact pb-event--due">{{icon:euro:sm}}MD</span><span class="pb-event pb-event--compact pb-event--start">{{icon:play:sm}}GV</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Venerdì 4 dicembre, nessun evento"><span class="pb-week__dow">Ven</span><span class="pb-week__num">4</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Sabato 5 dicembre, 1 evento"><span class="pb-week__dow">Sab</span><span class="pb-week__num">5</span><span class="pb-event pb-event--compact pb-event--end">{{icon:flag:sm}}AC</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Domenica 6 dicembre, 1 evento"><span class="pb-week__dow">Dom</span><span class="pb-week__num">6</span><span class="pb-event pb-event--compact pb-event--paid">{{icon:check:sm}}FN</span></button>
  </div></div>
  <div class="pb-daylist">
    <section class="pb-daylist__day">
      <h3 class="pb-daylist__date text-caption">Lunedì 30 novembre · oggi</h3>
      <a class="pb-event pb-event--due" href="#"><span class="pb-event__icon" aria-hidden="true">{{icon:euro:sm}}</span><span class="pb-event__body"><span class="pb-event__title text-body-strong">Rata di Anna Colombo</span><span class="pb-event__meta text-label pb-num">300,00&nbsp;€ · seconda di tre</span></span></a>
      <a class="pb-event pb-event--start" href="#"><span class="pb-event__icon" aria-hidden="true">{{icon:play:sm}}</span><span class="pb-event__body"><span class="pb-event__title text-body-strong">Inizio percorso di Maria Antonietta Degli Esposti-Bianchi</span><span class="pb-event__meta text-label">Annuale</span></span></a>
    </section>
  </div>
</div>
