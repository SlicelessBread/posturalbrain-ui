<!-- @dsCard group="Avvisi" height=200 subtitle="Stati con icona; punto di notifica" -->
<div class="pb-stack">
  <div class="pb-row">
    <span class="pb-badge pb-badge--ok">{{icon:check:sm}}Pagata</span>
    <span class="pb-badge pb-badge--warn">{{icon:clock:sm}}In scadenza</span>
    <span class="pb-badge pb-badge--danger">{{icon:circle-alert:sm}}Scaduta</span>
    <span class="pb-badge pb-badge--info">{{icon:calendar-days:sm}}Programmato</span>
    <span class="pb-badge pb-badge--neutral">Bozza</span>
  </div>
  <div class="pb-row">
    <span class="pb-row"><span class="pb-dot" aria-hidden="true"></span><span class="text-label">2 notifiche non lette</span></span>
  </div>
</div>
