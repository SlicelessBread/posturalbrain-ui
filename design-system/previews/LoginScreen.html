<!-- @dsCard group="Accesso" height=660 subtitle="Password e Face ID" -->
<div class="pb-frame" style="min-height: 620px">
  <main class="pb-login">
    <span class="pb-login__mark" aria-hidden="true">{{icon:activity:lg}}</span>
    <h1 class="text-display">PosturalBrain</h1>
    <p class="pb-muted">Entra per vedere pazienti, percorsi e scadenze.</p>
    <form class="pb-login__form pb-stack" onsubmit="return false">
      <label class="pb-field"><span class="pb-field__label text-label">Password</span><input class="pb-input" type="password" value="pianoforte-verde" autocomplete="current-password"></label>
      <button class="pb-btn pb-btn--primary pb-btn--block" type="submit">Entra</button>
      <span class="pb-login__or text-caption">oppure</span>
      <button class="pb-btn pb-btn--block" type="button">{{icon:scan-face}}Entra con Face ID</button>
    </form>
  </main>
</div>
