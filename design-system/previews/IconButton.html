<!-- @dsCard group="Azioni" height=120 subtitle="Semplice, principale, discreto, con punto di notifica" -->
<div class="pb-row">
  <button class="pb-icon-btn" type="button" aria-label="Notifiche">{{icon:bell}}<span class="pb-dot" aria-hidden="true"></span></button>
  <button class="pb-icon-btn pb-icon-btn--primary" type="button" aria-label="Aggiungi paziente">{{icon:plus}}</button>
  <button class="pb-icon-btn" type="button" aria-label="Mostra le cifre">{{icon:eye}}</button>
  <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Chiudi">{{icon:x}}</button>
  <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Indietro">{{icon:chevron-left}}</button>
</div>
