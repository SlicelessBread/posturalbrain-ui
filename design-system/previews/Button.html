<!-- @dsCard group="Azioni" height=420 subtitle="Principale, secondario, discreto, distruttivo; piccolo, a tutta larghezza, in attesa, disabilitato" -->
<div class="pb-stack">
  <div class="pb-row">
    <button class="pb-btn pb-btn--primary" type="button">Salva percorso</button>
    <button class="pb-btn" type="button">Annulla</button>
    <button class="pb-btn pb-btn--ghost" type="button">Vedi tutte</button>
  </div>
  <div class="pb-row">
    <button class="pb-btn pb-btn--primary" type="button">{{icon:plus}}Aggiungi paziente</button>
    <button class="pb-btn pb-btn--danger" type="button">{{icon:trash-2}}Elimina</button>
  </div>
  <div class="pb-row">
    <button class="pb-btn pb-btn--small" type="button">Oggi</button>
    <button class="pb-btn pb-btn--small pb-btn--primary" type="button">Segna pagata</button>
    <button class="pb-btn pb-btn--primary" type="button" aria-busy="true">Salvataggio…</button>
    <button class="pb-btn pb-btn--primary" type="button" disabled>Pubblica</button>
  </div>
  <button class="pb-btn pb-btn--primary pb-btn--block" type="button">Entra</button>
</div>
