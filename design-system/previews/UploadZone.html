<!-- @dsCard group="Video e file" height=820 subtitle="In attesa, mentre si trascina, in caricamento, completato, errore" -->
<div class="pb-stack">
  <label class="pb-upload pb-upload--idle"><input class="pb-sr-only" type="file" accept="video/mp4,video/quicktime" data-pb-compact><span class="pb-upload__icon" aria-hidden="true">{{icon:upload}}</span><strong class="text-body-strong">Scegli un video</strong><span class="text-label pb-muted">MP4 o MOV, fino a 1 GB</span></label>
  <div class="pb-upload pb-upload--dragging"><span class="pb-upload__icon" aria-hidden="true">{{icon:upload}}</span><strong class="text-body-strong">Rilascia qui il video</strong></div>
  <div class="pb-upload pb-upload--uploading">
    <div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true">{{icon:film}}</span><span class="pb-upload__name"><strong class="text-body-strong">esercizi-lombari-novembre.mp4</strong><span class="text-label pb-muted pb-num">312 MB di 780 MB</span></span><button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Annulla il caricamento">{{icon:x}}</button></div>
    <div class="pb-progress" role="progressbar" aria-label="Caricamento del video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" style="--value: 0.4"><span></span></div>
  </div>
  <div class="pb-upload pb-upload--done">
    <div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true">{{icon:circle-check}}</span><span class="pb-upload__name"><strong class="text-body-strong">esercizi-lombari-novembre.mp4</strong><span class="text-label pb-muted pb-num">780 MB · 2 min 14 s · verticale</span></span><button class="pb-btn pb-btn--small" type="button">Sostituisci</button></div>
  </div>
  <div class="pb-upload pb-upload--error">
    <div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true">{{icon:circle-alert}}</span><span class="pb-upload__name"><strong class="text-body-strong">Caricamento interrotto</strong><span class="text-label pb-muted">La connessione è caduta al 40%. Il file è ancora sul tuo telefono.</span></span><button class="pb-btn pb-btn--small" type="button">Riprova</button></div>
  </div>
</div>
