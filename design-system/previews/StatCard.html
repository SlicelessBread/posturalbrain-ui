<!-- @dsCard group="Superfici e liste" height=520 subtitle="Con icona e nota; in evidenza; negativo; toccabile" -->
<div class="pb-stack pb-stack--tight">
  <div class="pb-stat">
    <span class="pb-stat__icon" aria-hidden="true">{{icon:wallet}}</span>
    <div class="pb-stat__body">
      <span class="pb-stat__label text-label">Fatturato mensile lordo</span>
      <strong class="pb-stat__value text-figure pb-num">6.480,00&nbsp;€</strong>
      <span class="pb-stat__hint text-caption">12 rate previste a novembre</span>
    </div>
  </div>
  <button class="pb-stat pb-stat--interactive" type="button">
    <span class="pb-stat__icon" aria-hidden="true">{{icon:megaphone}}</span>
    <span class="pb-stat__body">
      <span class="pb-stat__label text-label">Spese per pubblicità</span>
      <strong class="pb-stat__value text-figure pb-num">350,00&nbsp;€</strong>
      <span class="pb-stat__hint text-caption">Tocca per modificare</span>
    </span>
    {{icon:chevron-right}}
  </button>
  <div class="pb-stat pb-stat--negative">
    <span class="pb-stat__icon" aria-hidden="true">{{icon:trending-down}}</span>
    <div class="pb-stat__body">
      <span class="pb-stat__label text-label">Guadagno netto di agosto</span>
      <strong class="pb-stat__value text-figure pb-num">−412,50&nbsp;€</strong>
      <span class="pb-stat__hint text-caption">In perdita: spese superiori agli incassi</span>
    </div>
  </div>
  <div class="pb-stat pb-stat--highlight">
    <span class="pb-stat__icon" aria-hidden="true">{{icon:trending-up}}</span>
    <div class="pb-stat__body">
      <span class="pb-stat__label text-label">Guadagno netto mensile</span>
      <strong class="pb-stat__value text-figure-lg pb-num">4.086,00&nbsp;€</strong>
      <span class="pb-stat__hint text-caption">Incassato meno collaboratori e pubblicità</span>
    </div>
  </div>
</div>
