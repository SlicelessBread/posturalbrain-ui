<!-- @dsCard group="Navigazione" height=220 subtitle="Mese; settimana con ritorno a oggi" -->
<div class="pb-stack">
  <div class="pb-period">
    <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Mese precedente">{{icon:chevron-left}}</button>
    <div class="pb-period__label" aria-live="polite"><strong class="text-body-strong">Novembre 2026</strong></div>
    <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Mese successivo">{{icon:chevron-right}}</button>
  </div>
  <div class="pb-period pb-period--week">
    <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Settimana precedente">{{icon:chevron-left}}</button>
    <div class="pb-period__label" aria-live="polite"><strong class="text-body-strong">30 nov – 6 dic</strong><span class="text-caption pb-subtle">Settimana 49</span></div>
    <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Settimana successiva">{{icon:chevron-right}}</button>
    <button class="pb-btn pb-btn--small" type="button">Oggi</button>
  </div>
</div>
