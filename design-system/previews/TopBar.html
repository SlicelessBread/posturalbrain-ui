<!-- @dsCard group="Navigazione" height=200 subtitle="Con marchio e azioni; con notifiche non lette" -->
<div class="pb-stack">
  <div class="pb-frame">
    <header class="pb-topbar">
      <div class="pb-topbar__brand"><span class="pb-topbar__mark" aria-hidden="true">{{icon:activity:sm}}</span>PosturalBrain</div>
      <div class="pb-topbar__actions">
        <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Nascondi le cifre">{{icon:eye}}</button>
        <button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Notifiche, 2 non lette">{{icon:bell}}<span class="pb-dot" aria-hidden="true"></span></button>
      </div>
    </header>
  </div>
  <div class="pb-frame">
    <header class="pb-topbar">
      <div class="pb-topbar__brand"><span class="pb-topbar__mark" aria-hidden="true">{{icon:send:sm}}</span>SociAll</div>
      <div class="pb-topbar__actions">
        <button class="pb-btn pb-btn--small pb-btn--ghost" type="button">Esci</button>
      </div>
    </header>
  </div>
</div>
