<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DateField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <label class="pb-field"><span class="pb-field__label text-label">Inizio del percorso</span>
    <span class="pb-input-group"><input class="pb-input" type="date" value="2026-11-14"><span class="pb-input-group__suffix" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span></span>
    <span class="pb-field__help text-caption">Finisce il 14 maggio 2027.</span>
  </label>
  <label class="pb-field pb-field--invalid"><span class="pb-field__label text-label">Scadenza della seconda rata</span>
    <span class="pb-input-group"><input class="pb-input" type="date" value="2026-10-01" aria-invalid="true"><span class="pb-input-group__suffix" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg></span></span>
    <span class="pb-field__error text-caption"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>La rata scade prima dell'inizio del percorso.</span>
  </label>
</div>
</body>
</html>
