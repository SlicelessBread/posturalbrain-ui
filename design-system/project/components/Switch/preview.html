<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Switch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-list">
  <div class="pb-switch-row"><span id="sw-1" class="pb-switch-row__text">Notifiche sul telefono<span class="text-caption pb-subtle">Ogni mattina, per rate e percorsi in scadenza.</span></span><button class="pb-switch" type="button" role="switch" aria-checked="true" aria-labelledby="sw-1"></button></div>
  <div class="pb-switch-row"><span id="sw-2" class="pb-switch-row__text">Email del mattino</span><button class="pb-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-2"></button></div>
  <div class="pb-switch-row"><span id="sw-3" class="pb-switch-row__text">Entra con Face ID<span class="text-caption pb-subtle">Non disponibile su questo dispositivo.</span></span><button class="pb-switch" type="button" role="switch" aria-checked="false" aria-labelledby="sw-3" disabled></button></div>
</div>
</body>
