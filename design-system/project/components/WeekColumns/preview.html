<!-- @dsCard group="Calendario" height=420 subtitle="Sette colonne, oggi in evidenza, giorno scelto con il dettaglio sotto" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WeekColumns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <div class="pb-week"><div class="pb-week__grid">
    <button class="pb-week__day pb-week__day--today" type="button" aria-pressed="true" aria-label="Lunedì 30 novembre, oggi, 4 eventi"><span class="pb-week__dow">Lun</span><span class="pb-week__num">30</span><span class="pb-event pb-event--compact pb-event--due"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>AC</span><span class="pb-event pb-event--compact pb-event--start"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>MD</span><span class="pb-event pb-event--compact pb-event--paid"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>LB</span><span class="pb-event pb-event--compact pb-event--end"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>PR</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Martedì 1 dicembre, nessun evento"><span class="pb-week__dow">Mar</span><span class="pb-week__num">1</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Mercoledì 2 dicembre, 1 evento"><span class="pb-week__dow">Mer</span><span class="pb-week__num">2</span><span class="pb-event pb-event--compact pb-event--due"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>SC</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Giovedì 3 dicembre, 2 eventi"><span class="pb-week__dow">Gio</span><span class="pb-week__num">3</span><span class="pb-event pb-event--compact pb-event--due"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg>MD</span><span class="pb-event pb-event--compact pb-event--start"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>GV</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Venerdì 4 dicembre, nessun evento"><span class="pb-week__dow">Ven</span><span class="pb-week__num">4</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Sabato 5 dicembre, 1 evento"><span class="pb-week__dow">Sab</span><span class="pb-week__num">5</span><span class="pb-event pb-event--compact pb-event--end"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>AC</span></button>
    <button class="pb-week__day" type="button" aria-pressed="false" aria-label="Domenica 6 dicembre, 1 evento"><span class="pb-week__dow">Dom</span><span class="pb-week__num">6</span><span class="pb-event pb-event--compact pb-event--paid"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>FN</span></button>
  </div></div>
  <div class="pb-daylist">
    <section class="pb-daylist__day">
      <h3 class="pb-daylist__date text-caption">Lunedì 30 novembre · oggi</h3>
      <a class="pb-event pb-event--due" href="#"><span class="pb-event__icon" aria-hidden="true"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h12"/><path d="M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/></svg></span><span class="pb-event__body"><span class="pb-event__title text-body-strong">Rata di Anna Colombo</span><span class="pb-event__meta text-label pb-num">300,00&nbsp;€ · seconda di tre</span></span></a>
      <a class="pb-event pb-event--start" href="#"><span class="pb-event__icon" aria-hidden="true"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg></span><span class="pb-event__body"><span class="pb-event__title text-body-strong">Inizio percorso di Maria Antonietta Degli Esposti-Bianchi</span><span class="pb-event__meta text-label">Annuale</span></span></a>
    </section>
  </div>
</div>
</body>
</html>
