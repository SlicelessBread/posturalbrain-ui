<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Segmented</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <div class="pb-segmented" role="group" aria-label="Vista dei post">
    <button type="button" aria-pressed="true">Lista</button>
    <button type="button" aria-pressed="false">Calendario</button>
  </div>
  <div class="pb-segmented" role="group" aria-label="Durata del percorso">
    <button type="button" aria-pressed="false">Trimestrale</button>
    <button type="button" aria-pressed="true">Semestrale</button>
    <button type="button" aria-pressed="false">Annuale</button>
  </div>
</div>
</body>
</html>
