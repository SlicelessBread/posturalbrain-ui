<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <div class="pb-tabs" role="tablist" aria-label="Video">
    <button type="button" role="tab" aria-selected="true">Assegnati</button>
    <button type="button" role="tab" aria-selected="false">Preferiti</button>
  </div>
  <div class="pb-tabs" role="tablist" aria-label="Scheda paziente">
    <button type="button" role="tab" aria-selected="false">Dati</button>
    <button type="button" role="tab" aria-selected="true">Percorsi</button>
    <button type="button" role="tab" aria-selected="false">Rate</button>
    <button type="button" role="tab" aria-selected="false">Video assegnati</button>
    <button type="button" role="tab" aria-selected="false">Note</button>
  </div>
</div>
</body>
</html>
