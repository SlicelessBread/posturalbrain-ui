<!-- @dsCard group="Azioni" height=180 subtitle="Scelta multipla, con e senza icona" -->
<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chip</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <div class="pb-row" role="group" aria-label="Piattaforme">
    <button class="pb-chip" type="button" aria-pressed="true"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>YouTube</button>
    <button class="pb-chip" type="button" aria-pressed="true"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Instagram</button>
    <button class="pb-chip" type="button" aria-pressed="false">Facebook</button>
    <button class="pb-chip" type="button" aria-pressed="false">TikTok</button>
  </div>
  <div class="pb-row" role="group" aria-label="Filtra i video">
    <button class="pb-chip" type="button" aria-pressed="true">Tutti</button>
    <button class="pb-chip" type="button" aria-pressed="false"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>Preferiti</button>
    <button class="pb-chip" type="button" aria-pressed="false">Schiena</button>
  </div>
</div>
</body>
</html>
