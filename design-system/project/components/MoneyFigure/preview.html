<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>MoneyFigure</title>

<body class="pb-app pb-app--inline">
<div class="pb-stack pb-stack--loose"><div class="pb-money"><span class="pb-money__label text-label">Guadagno netto di novembre</span><strong class="pb-money__value text-figure-lg pb-num">4.086,00 €</strong><span class="pb-money__delta pb-money__delta--up text-label"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>+320,00 € rispetto a ottobre</span></div><div class="pb-money"><span class="pb-money__label text-label">Incassato nel 2026</span><strong class="pb-money__value text-figure-lg pb-num">52.300,00 €</strong><span class="pb-money__delta pb-money__delta--down text-label"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>−1.150,00 € rispetto al 2025</span></div><div class="pb-money pb-money--negative"><span class="pb-money__label text-label">Guadagno netto di agosto</span><strong class="pb-money__value text-figure-lg pb-num">−412,50 €</strong><span class="pb-money__delta text-label">Studio chiuso tre settimane</span></div></div>
</body>
