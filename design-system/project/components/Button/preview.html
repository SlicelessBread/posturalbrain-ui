<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Button</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <div class="pb-row">
    <button class="pb-btn pb-btn--primary" type="button">Salva percorso</button>
    <button class="pb-btn" type="button">Annulla</button>
    <button class="pb-btn pb-btn--ghost" type="button">Vedi tutte</button>
  </div>
  <div class="pb-row">
    <button class="pb-btn pb-btn--primary" type="button"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Aggiungi paziente</button>
    <button class="pb-btn pb-btn--danger" type="button"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>Elimina</button>
  </div>
  <div class="pb-row">
    <button class="pb-btn pb-btn--small" type="button">Oggi</button>
    <button class="pb-btn pb-btn--small pb-btn--primary" type="button">Segna pagata</button>
    <button class="pb-btn pb-btn--primary" type="button" aria-busy="true">Salvataggio…</button>
    <button class="pb-btn pb-btn--primary" type="button" disabled>Pubblica</button>
  </div>
  <button class="pb-btn pb-btn--primary pb-btn--block" type="button">Entra</button>
</div>
</body>
</html>
