<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-frame" style="min-height:560px"><div class="pb-stack" style="padding:var(--space-4)"><button type="button" class="pb-btn" data-demo-open="true">Apri il foglio</button><div class="pb-skeleton pb-skeleton--block" style="height:64px"></div><div class="pb-skeleton pb-skeleton--block" style="height:64px"></div></div><div class="pb-sheet-backdrop"></div><dialog class="pb-sheet" aria-labelledby="_R_2_" open="" closedby="any"><span class="pb-sheet__grabber" aria-hidden="true"></span><header class="pb-sheet__head"><h2 id="_R_2_" class="text-section">Aggiungi collaboratore</h2><button type="button" class="pb-icon-btn pb-icon-btn--ghost" aria-label="Chiudi"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></header><div class="pb-sheet__body pb-stack"><label class="pb-field"><span id="_R_bm_" class="pb-field__label text-label">Nome e cognome</span><input type="text" class="pb-input" autoComplete="off" aria-labelledby="_R_bm_" value="Sara Conti"/></label><label class="pb-field"><span id="_R_jm_" class="pb-field__label text-label">Stipendio mensile</span><span class="pb-input-group"><input class="pb-input pb-num" type="text" inputMode="decimal" autoComplete="off" aria-labelledby="_R_jm_" aria-describedby="_R_jmH1_" value="400,00"/><span class="pb-input-group__suffix" aria-hidden="true">€</span></span><span id="_R_jmH1_" class="pb-field__help text-caption">Da novembre 2026 in poi. Puoi cambiarlo mese per mese.</span></label></div><footer class="pb-sheet__actions"><button type="button" class="pb-btn pb-btn--primary pb-btn--block">Aggiungi collaboratore</button></footer></dialog></div>
<script>
// Demo only: opens and closes the sheet drawn in this preview.
  const sheet = document.querySelector('.pb-sheet');
  const veil = document.querySelector('.pb-sheet-backdrop');
  const ended = (el) => Promise.all(el.getAnimations().map((a) => a.finished.catch(() => {})));
  const close = async () => {
    sheet.setAttribute('data-closing', '');
    veil.setAttribute('data-closing', '');
    await Promise.all([ended(sheet), ended(veil)]);
    sheet.removeAttribute('open');
    veil.hidden = true;
    sheet.removeAttribute('data-closing');
    veil.removeAttribute('data-closing');
  };
  sheet.querySelector('.pb-sheet__head button').addEventListener('click', close);
  sheet.querySelector('.pb-sheet__actions button').addEventListener('click', close);
  document.querySelector('[data-demo-open]').addEventListener('click', () => {
    veil.hidden = false;
    sheet.setAttribute('open', '');
  });
</script>
</body>
</html>
