<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sheet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-frame" style="min-height: 560px">
  <div class="pb-stack" style="padding: var(--space-4)" aria-hidden="true"><div class="pb-skeleton pb-skeleton--block" style="height: 64px"></div><div class="pb-skeleton pb-skeleton--block" style="height: 64px"></div></div>
  <div class="pb-sheet-backdrop"></div>
  <section class="pb-sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <span class="pb-sheet__grabber" aria-hidden="true"></span>
    <header class="pb-sheet__head"><h2 id="sheet-title" class="text-section">Aggiungi collaboratore</h2><button class="pb-icon-btn pb-icon-btn--ghost" type="button" aria-label="Chiudi"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></header>
    <div class="pb-sheet__body pb-stack">
      <label class="pb-field"><span class="pb-field__label text-label">Nome e cognome</span><input class="pb-input" type="text" value="Sara Conti" autocomplete="off"></label>
      <label class="pb-field"><span class="pb-field__label text-label">Stipendio mensile</span><span class="pb-input-group"><input class="pb-input pb-num" type="text" inputmode="decimal" value="400,00" autocomplete="off"><span class="pb-input-group__suffix" aria-hidden="true">€</span></span><span class="pb-field__help text-caption">Da novembre 2026 in poi. Puoi cambiarlo mese per mese.</span></label>
    </div>
    <footer class="pb-sheet__actions"><button class="pb-btn pb-btn--primary pb-btn--block" type="button">Aggiungi collaboratore</button></footer>
  </section>
</div>
</body>
</html>
