<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>UploadZone</title>

<body class="pb-app pb-app--inline">
<div class="pb-stack"><label class="pb-upload pb-upload--idle"><input class="pb-sr-only" type="file" accept="video/mp4,video/quicktime" data-pb-compact=""/><span class="pb-upload__icon" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span><strong class="text-body-strong">Scegli un video</strong><span class="text-label pb-muted">MP4 o MOV, fino a 1 GB</span></label><label class="pb-upload pb-upload--dragging"><input class="pb-sr-only" type="file" accept="video/mp4,video/quicktime" data-pb-compact=""/><span class="pb-upload__icon" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg></span><strong class="text-body-strong">Rilascia qui il video</strong></label><div class="pb-upload pb-upload--uploading" role="status"><div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/></svg></span><span class="pb-upload__name"><strong class="text-body-strong">esercizi-lombari-novembre.mp4</strong><span class="text-label pb-muted pb-num">312 MB di 780 MB</span></span><button type="button" class="pb-icon-btn pb-icon-btn--ghost" aria-label="Annulla il caricamento"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div class="pb-progress" role="progressbar" aria-label="Caricamento del video" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40" style="--value:0.4"><span></span></div></div><div class="pb-upload pb-upload--done" role="status"><div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></span><span class="pb-upload__name"><strong class="text-body-strong">esercizi-lombari-novembre.mp4</strong><span class="text-label pb-muted pb-num">780 MB · 2 min 14 s · verticale</span></span><button type="button" class="pb-btn pb-btn--small">Sostituisci</button></div></div><div class="pb-upload pb-upload--error" role="alert"><div class="pb-upload__file"><span class="pb-upload__icon" aria-hidden="true"><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg></span><span class="pb-upload__name"><strong class="text-body-strong">Caricamento interrotto</strong><span class="text-label pb-muted">La connessione è caduta al 40%. Il file è ancora sul tuo telefono.</span></span><button type="button" class="pb-btn pb-btn--small">Riprova</button></div></div></div>
</body>
</html>
