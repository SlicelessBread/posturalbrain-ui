<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TextField</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <label class="pb-field"><span class="pb-field__label text-label">Nome e cognome</span><input class="pb-input" type="text" placeholder="Es. Anna Colombo" autocomplete="off"></label>
  <label class="pb-field"><span class="pb-field__label text-label">Nome e cognome</span><input class="pb-input" type="text" value="Anna Colombo" autocomplete="off"><span class="pb-field__help text-caption">Come compare negli elenchi e nei promemoria.</span></label>
  <label class="pb-field pb-field--invalid"><span class="pb-field__label text-label">Telefono</span><input class="pb-input" type="tel" value="333 12" aria-invalid="true" autocomplete="off"><span class="pb-field__error text-caption"><svg class="pb-icon pb-icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>Il numero è incompleto: servono almeno 9 cifre.</span></label>
  <label class="pb-field"><span class="pb-field__label text-label">Collaboratore</span><input class="pb-input" type="text" value="Marco Riva" disabled></label>
  <label class="pb-field"><span class="pb-field__label text-label">Descrizione</span><textarea class="pb-input" rows="3">Tre esercizi per sbloccare la zona lombare, da fare al mattino.</textarea><span class="pb-field__help text-caption pb-num">64 di 2.200 caratteri</span></label>
</div>
</body>
</html>
