<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-stack">
  <section class="pb-card">
    <h2 class="text-section">Percorso semestrale</h2>
    <p class="pb-muted">Dal 14 novembre 2026 al 14 maggio 2027, tre rate da 300,00&nbsp;€.</p>
  </section>
  <section class="pb-card pb-card--raised">
    <h2 class="text-section">Rinnovo in arrivo</h2>
    <p class="pb-muted">Il percorso di Anna Colombo finisce tra 5 giorni.</p>
    <div class="pb-row"><button class="pb-btn pb-btn--small pb-btn--primary" type="button">Rinnova</button><button class="pb-btn pb-btn--small" type="button">Più tardi</button></div>
  </section>
  <a class="pb-card pb-card--interactive" href="#">
    <span class="pb-row pb-row--between pb-row--nowrap"><span class="text-section">Collaboratori</span><svg class="pb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
    <span class="pb-muted">3 persone · 2.100,00&nbsp;€ a novembre</span>
  </a>
</div>
</body>
</html>
