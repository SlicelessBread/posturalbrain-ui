<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ThemeSwitch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Red+Hat+Text:wght@400;500;600&display=swap">
</head>
<body class="pb-app pb-app--inline">
<div class="pb-theme-switch">
  <span id="theme-label" class="text-body-strong">Tema</span>
  <div class="pb-segmented" role="group" aria-labelledby="theme-label">
    <button type="button" aria-pressed="true" data-choice="auto">Automatico</button>
    <button type="button" aria-pressed="false" data-choice="light">Chiaro</button>
    <button type="button" aria-pressed="false" data-choice="dark">Scuro</button>
  </div>
  <span class="text-caption pb-subtle">Automatico segue l'impostazione del telefono.</span>
</div>
<script>
  // Demo only: applies the choice to this preview.
  const root = document.documentElement;
  const initial = root.dataset.theme;
  document.querySelectorAll('[data-choice]').forEach((button) => {
    button.addEventListener('click', () => {
      document.querySelectorAll('[data-choice]').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      const choice = button.dataset.choice;
      const system = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      root.dataset.theme = choice === 'auto' ? (initial || system) : choice;
    });
  });
</script>
</body>
</html>
